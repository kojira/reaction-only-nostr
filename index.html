<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaction Only</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Reaction Only</h1><p>言葉の代わりに、リアクションで会話しよう。</p><p id="status" role="status">Goを読み込み中…</p><button id="login">NIP-07でログイン</button><p id="account"></p><details><summary>リレー設定</summary><label>公開リレー（空白・カンマ・改行区切り）<textarea id="relays">wss://relay.damus.io wss://nos.lol</textarea></label><button id="connect">接続</button></details><section><h2>リアクションを送る</h2><label>対象イベントID（64桁hex）<input id="targetEvent" autocomplete="off"></label><label>対象の公開鍵（64桁hex）<input id="targetPubkey" autocomplete="off"></label><label>通常絵文字<input id="emoji" value="❤️" maxlength="64"></label><details><summary>カスタム絵文字（NIP-30）</summary><label>ショートコード<input id="shortcode" placeholder="party_parrot"></label><label>画像のHTTPS URL<input id="emojiURL" type="url" placeholder="https://example.com/emoji.png"></label><p>入力すると通常絵文字より優先されます。</p><label>画像にする文字<input id="imageText" maxlength="8" placeholder="🌸"></label><button type="button" id="generate">文字から画像を生成して公開</button><p>生成画像はBlossomサーバーに公開されます。アップロード承認にNIP-07署名を使用します。</p><button id="register" type="button">自分の絵文字セットに登録</button><div id="emojiSet"></div></details><button id="publish">署名して公開</button></section><section><h2>リアクション</h2><p>公開リレーから取得した最新のリアクションです。イベントを選んで返信できます。</p><div id="feed"></div></section></main><script src="wasm_exec.js"></script><script src="image.js"></script><script src="boot.js"></script></body></html>
