<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f2fa">
  <title>Reaction Only</title>
  <link rel="stylesheet" href="style.css?v=viewer2">
</head>
<body>
<header class="appbar"><button id="menuToggle" class="menu-toggle" type="button" aria-label="メニューを開く" aria-controls="menuPanel" aria-expanded="false">☰</button><span class="app-icon" aria-hidden="true">✦</span><span>Reaction Only</span><div id="account" class="account" hidden aria-label="ログイン中"><span id="accountAvatar" class="avatar" aria-hidden="true">👤</span><span id="accountName" hidden></span></div></header>
<main>
  
  <div id="connectionCard" class="account-card">
    <div><p id="status" role="status">Goを読み込み中…</p></div>
    <button id="login">NIP-07でログイン</button>
  </div>
  <aside id="menuPanel" class="settings" hidden aria-label="メニュー">
  <label for="fontSize">文字サイズ</label><select id="fontSize"><option value="extra-small">極小</option><option value="smaller">より小</option><option value="small">小</option><option value="medium">中</option><option value="large">大</option><option value="extra-large">特大</option></select>
  <details><summary>よく使う絵文字</summary>
    <label for="defaultEmojis">絵文字（空白区切り）</label>
    <input id="defaultEmojis" autocomplete="off" placeholder="❤️ 👍 🎉 😮">
    <button id="saveEmojis" type="button">保存</button><p id="emojiSettingsStatus" role="status"></p>
  </details>
  <details class="relay-settings"><summary>リレー設定</summary><ul><li>wss://r.kojira.io</li><li>wss://x.kojira.io</li><li>wss://n.kojira.io</li></ul><button id="connect">接続</button></details>
    <details><summary>カスタム絵文字（NIP-30）</summary>
      <label>ショートコード<input id="shortcode" placeholder="party_parrot" spellcheck="false"></label>
      <label>画像のHTTPS URL<input id="emojiURL" type="url" placeholder="https://example.com/emoji.png"></label>
      <label>画像にする文字<input id="imageText" maxlength="8" placeholder="🌸"></label>
      <button type="button" id="generate" aria-label="文字から画像を生成してBlossomに公開（NIP-07署名が必要）">画像を公開</button>
      
      <button id="register" type="button">登録</button><div id="emojiSet"></div>
    </details>
  </aside>
  <section class="timeline"><h2>リアクション</h2><p id="feedState" role="status"></p><div id="feed"></div></section>
</main>
<dialog id="reactionViewer" aria-label="リアクションの拡大表示"><button id="reactionViewerClose" type="button" aria-label="閉じる">閉じる ×</button><div id="reactionViewerContent"></div></dialog>
<script src="card-modal.js?v=viewer1"></script><script src="settings.js"></script><script src="wasm_exec.js"></script><script src="image.js"></script><script src="boot.js?v=viewer1"></script>
</body></html>
